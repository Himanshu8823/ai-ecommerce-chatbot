services:
  - type: web
    name: ai-ecommerce-chatbot-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON_AI_URL
        fromService:
          type: web
          name: ai-ecommerce-chatbot-ai
          property: host

  - type: web
    name: ai-ecommerce-chatbot-ai
    runtime: python
    plan: free
    rootDir: python_ai_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
