services:
  - type: web
    name: ai-ecommerce-chatbot-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON_AI_URL
        fromService:
          type: web
          name: ai-ecommerce-chatbot-ai
          property: host
          envVarKey: PYTHON_AI_URL

  - type: web
    name: ai-ecommerce-chatbot-ai
    runtime: python
    plan: free
    rootDir: python_ai_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini

  - type: web
    name: ai-ecommerce-chatbot-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-ecommerce-chatbot-backend
          property: host
          envVarKey: VITE_API_URL
